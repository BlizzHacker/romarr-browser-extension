<!doctype html>
<!--
  A Vimm vault detail page, rebuilt from the structure documented in the
  ROMarr repo's rom-site-survey.md and vimm_index.py.

  Deliberately reproduces the two traps that corrupted the previous capture,
  so the test proves this extension is not caught by them:

    * the hidden decoy anchor pointing at /vault/999999, and
    * `href= "..."` written with a space after the equals sign.

  Nothing here is fetched from Vimm. Playwright fulfils the request locally,
  so this test makes no request to the real site at all.
-->
