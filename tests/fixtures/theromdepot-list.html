<!doctype html>
<!-- A small rendering of The ROM Depot's live virtualised `.entry` rows. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The ROM Depot</title>
  <link rel="canonical" href="https://theromdepot.com/Nintendo%2064/Europe">
</head>
<body>
  <div id="browser-content">
    <div class="entry header"><span class="name-col">Name</span></div>
    <div class="entry">
      <span class="icon-col"></span>
      <span class="name-col"><a class="name-col"
        href="/api/download/Nintendo%2064/Europe/Homebrew%20Demo.z64"
        download="Homebrew Demo.z64">Homebrew Demo.z64</a></span>
      <span class="count-col"></span>
      <span class="size-col">8.39 MB</span>
      <span class="mtime-date-col">07/16/2021</span>
    </div>
    <div class="entry">
      <span class="name-col"><a class="name-col"
        href="/Nintendo%2064/Europe/Subdirectory">Subdirectory</a></span>
      <span class="size-col">12.6 MB</span>
    </div>
  </div>
</body>
</html>
