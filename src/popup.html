<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>ROMarr capture</h1>
  <p id="where" class="note small">Reading this page…</p>
  <div id="preview" class="preview"></div>
  <div class="row">
    <button id="send">Send to ROMarr</button>
    <button id="options" class="secondary">Settings</button>
  </div>
  <p id="result" class="result" role="status"></p>
  <section class="catalog-search">
    <h2>Local catalog</h2>
    <div class="row">
      <input id="catalog-query" type="text" placeholder="Search local catalog">
      <button id="catalog-search" class="secondary">Search</button>
    </div>
    <p id="catalog-count" class="note small">0 saved</p>
    <div id="catalog-results" class="preview"></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
